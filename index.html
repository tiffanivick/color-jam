<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6ff0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Color Jam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>Color Jam</title>
    <link rel="preload" href="fonts/BagelFatOne-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="style.css?v=50" />
  </head>
  <body data-world="meadow">
    <div id="bg" aria-hidden="true"><div class="hills"></div><div class="deco" id="deco"></div></div>

    <!-- ===================== HUB (home / map / collection / shop / trophies) ===================== -->
    <div id="hub" class="screen">
      <button class="build-tag" id="buildTag" aria-label="Build info"></button>
      <header class="topbar">
        <button class="avatar" id="avatarBtn" aria-label="Trophies"></button>
        <div class="hpill" title="Stars"><b id="starCount">0</b><svg class="hp-ic star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.4 5.9 20.8l1.4-6.8L2.2 9.3l6.9-.8L12 2.2Z"/></svg></div>
        <div class="hpill" title="Coins"><button class="hp-plus" id="coinPlus" aria-label="Shop">+</button><b id="coinCount">0</b><i class="coin hp-ic"></i></div>
        <button class="gear" id="soundBtn" aria-label="Settings"></button>
      </header>

      <main class="panes">
        <!-- HOME -->
        <section class="pane home" id="paneHome">
          <button class="vault-bar" id="vaultBar" aria-label="Vault Run"></button>
          <div class="home-stage">
            <div class="ev-col">
              <button class="ev" id="evWorkshop"></button>
              <button class="ev" id="evChest"></button>
              <button class="ev" id="evRush"></button>
            </div>
            <div class="lv-path" id="lvPath"></div>
            <div class="ev-col">
              <button class="ev" id="evQuests"></button>
              <button class="ev" id="evVault"></button>
              <button class="ev" id="evLogin"></button>
            </div>
          </div>
          <div class="home-go">
            <button class="world-strip" id="worldStrip" aria-label="World picture"></button>
            <button class="play-btn" id="playBtn"><span class="play-level" id="playLevel">Play</span></button>
          </div>
        </section>

        <!-- MAP -->
        <section class="pane" id="paneMap" hidden>
          <div class="world-tabs" id="worldTabs"></div>
          <div class="map-scroll" id="mapScroll"><div class="map" id="mapPath"></div></div>
        </section>

        <!-- COLLECTION: every world's brick picture -->
        <section class="pane" id="paneCollection" hidden>
          <h2 class="cbj-title">Collection</h2>
          <div class="coll-hero" id="collHero"></div>
          <div class="coll-grid" id="collGrid"></div>
        </section>

        <!-- QUESTS -->
        <section class="pane" id="paneQuests" hidden>
          <div class="notebook">
            <h2 class="cbj-title">Daily Quest</h2>
            <div class="timer-chip" id="questReset"></div>
            <div class="list" id="questList"></div>
            <div class="streak-card">
              <div class="eyebrow">Log in every day</div>
              <div class="streak-days" id="streakDays"></div>
            </div>
          </div>
        </section>

        <!-- SHOP -->
        <section class="pane" id="paneShop" hidden>
          <h2 class="cbj-title">Shop</h2>
          <p class="pane-sub">Spend the coins you earn on boosters.</p>
          <div class="list" id="shopList"></div>
        </section>

        <!-- WORKSHOP (workshop.js) -->
        <section class="pane" id="paneWorkshop" hidden>
          <h2 class="cbj-title">Workshop</h2>
          <p class="pane-sub">Open mystery blocks, collect the pieces, build gadgets.</p>
          <div id="workshop"></div>
        </section>

        <!-- TROPHIES -->
        <section class="pane" id="paneTrophies" hidden>
          <h2 class="cbj-title">Trophies</h2>
          <p class="pane-sub" id="trophySub"></p>
          <div class="trophy-grid" id="trophyGrid"></div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar">
        <button class="tab" data-pane="Shop"><i class="tab-ic" data-ic="tabShop"></i><span>Shop</span></button>
        <button class="tab" data-pane="Map"><i class="tab-ic" data-ic="tabMap"></i><span>Map</span></button>
        <button class="tab on" data-pane="Home"><i class="tab-ic" data-ic="tabHome"></i><span>Home</span></button>
        <button class="tab" data-pane="Collection"><i class="tab-ic" data-ic="tabBook"></i><span>Collection</span></button>
        <button class="tab" data-pane="Trophies"><i class="tab-ic" data-ic="tabTrophy"></i><span>Trophies</span></button>
      </nav>
    </div>

    <!-- ===================== GAME ===================== -->
    <div id="game" class="screen" hidden>
      <header class="hud">
        <div class="hud-main">
          <div class="lvl-badge"><small>Level</small><b id="levelTitle">1</b></div>
          <div class="time-panel">
            <span class="tp-label"><i class="tp-clock"></i>Time</span>
            <div class="timer idle" id="timer"><i id="timerBar"></i><span id="timerText">1:00</span></div>
          </div>
        </div>
        <div class="hud-btns">
          <button class="sq-btn orange" id="resetBtn" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8Z"/></svg></button>
          <button class="sq-btn blue" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
        </div>
      </header>
      <div class="hud-row">
        <div class="moves-goal"><span>Moves</span><b id="moveCount">0</b><div class="goal" id="goalStars" aria-label="Star goals"></div></div>
        <div class="coin-pill"><i class="coin"></i><b id="gameCoins">0</b></div>
      </div>
      <div class="combo" id="combo"><span id="comboText">x2</span><i id="comboBar"></i></div>
      <div class="tip" id="tip"></div>
      <div class="board-wrap"><div class="board-fit" id="boardFit"><div class="board-scale" id="boardScale"><div class="board" id="board"></div></div></div></div>
      <div class="boosters">
        <div class="gadgets" id="gadgets"></div>
        <button class="booster" id="boosterFreeze"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-1 3v6l4.2 2.5 1-1.7L13 12V7h-2Z"/></svg></span><span class="b-name">Freeze</span><span class="b-count" id="cntFreeze">0</span></button>
        <button class="booster" id="boosterHammer"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M13.5 3 9 7.5l1.6 1.6-6.9 6.9 2.3 2.3 6.9-6.9 1.6 1.6L19 8.5 13.5 3Z"/></svg></span><span class="b-name">Hammer</span><span class="b-count" id="cntHammer">0</span></button>
        <button class="booster" id="boosterVac"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9h2a7 7 0 0 1 7-7V3Zm0 4a5 5 0 0 0-5 5h2a3 3 0 0 1 3-3V7Zm0 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm9 1a9 9 0 0 1-9 9v-2a7 7 0 0 0 7-7h2Zm-4 0a5 5 0 0 1-5 5v-2a3 3 0 0 0 3-3h2Z"/></svg></span><span class="b-name">Vacuum</span><span class="b-count" id="cntVac">0</span></button>
        <button class="booster" id="boosterUndo"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M12 5V2L6.5 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8Z"/></svg></span><span class="b-name">Undo</span><span class="b-count" id="cntUndo">0</span></button>
        <button class="booster" id="boosterTools" hidden><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M9 3h6a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v3h-7v-1h-2v1H2V9a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2Zm0 2v2h6V5H9ZM2 14h9v1h2v-1h9v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5Z"/></svg></span><span class="b-name">Gadgets</span><span class="b-count" id="cntTools">0</span></button>
      </div>
    </div>

    <!-- ===================== MODALS ===================== -->
    <div class="overlay hidden" id="modal"><div class="sheet" id="sheet"></div></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="src/sound.js?v=50"></script>
    <script src="src/worlds.js?v=50"></script>
    <script src="src/brick.js?v=50"></script>
    <script src="src/block3d.js?v=50"></script>
    <script src="src/engine.js?v=50"></script>
    <script src="src/fx.js?v=50"></script>
    <script src="src/workshop.js?v=50"></script>
    <script src="src/app.js?v=50"></script>
  <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    </script>
  </body>
</html>
