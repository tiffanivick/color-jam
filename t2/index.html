<!doctype html>
<html lang="en">
  <head>
    <base href="../" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b8fe0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CJ test B" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="icon.png" />
    
    <title>Color Jam</title>
    <link rel="preload" href="fonts/BagelFatOne-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="style.css?v=26" />
  </head>
  <body data-world="meadow">
    <div id="bg" aria-hidden="true"><div class="hills"></div><div class="deco" id="deco"></div></div>

    <!-- ===================== HUB (home / map / quests / shop / trophies) ===================== -->
    <div id="hub" class="screen">
      <button class="build-tag" id="buildTag" aria-label="Build info"></button>
      <header class="topbar">
        <div class="pill" title="Coins"><i class="coin"></i><b id="coinCount">0</b></div>
        <div class="pill" title="Stars"><svg class="mini-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.4 5.9 20.8l1.4-6.8L2.2 9.3l6.9-.8L12 2.2Z"/></svg><b id="starCount">0</b></div>
        <button class="icon-btn" id="soundBtn" aria-label="Sound"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
      </header>

      <main class="panes">
        <!-- HOME -->
        <section class="pane" id="paneHome">
          <h1 class="wordmark wordmark-big">Color Jam</h1>
          <div class="world-card" id="worldCard">
            <div class="world-head">
              <div>
                <div class="eyebrow" id="worldIndex">World 1</div>
                <h2 id="worldName">Sunny Meadow</h2>
              </div>
              <div class="world-prog"><b id="worldProg">0/9</b><span>levels</span></div>
            </div>
            <div class="mosaic-wrap"><div class="mosaic" id="homeMosaic"></div></div>
            <div class="picture-note" id="pictureNote">Rebuilding: a cozy cottage</div>
            <div class="bar"><i id="worldBar"></i></div>
          </div>
          <button class="play-btn" id="playBtn"><span class="play-level" id="playLevel">Play</span><span class="play-sub" id="playSub"></span></button>
          <div class="tiles">
            <button class="tile" id="tileChest"><span class="tile-ic" id="chestIc"></span><span class="tile-t">Chests</span><span class="badge" id="chestBadge" hidden>0</span></button>
            <button class="tile" id="tileQuests"><span class="tile-ic" id="questIc"></span><span class="tile-t">Daily quests</span><span class="badge" id="questBadge" hidden>0</span></button>
            <button class="tile" id="tileRush"><span class="tile-ic" id="rushIc"></span><span class="tile-t">Bonus Rush</span><span class="badge" id="rushBadge" hidden>0</span></button>
          </div>
        </section>

        <!-- MAP -->
        <section class="pane" id="paneMap" hidden>
          <div class="world-tabs" id="worldTabs"></div>
          <div class="map-scroll" id="mapScroll"><div class="map" id="mapPath"></div></div>
        </section>

        <!-- QUESTS -->
        <section class="pane" id="paneQuests" hidden>
          <h2 class="pane-title">Daily quests</h2>
          <p class="pane-sub" id="questReset">New quests every day.</p>
          <div class="list" id="questList"></div>
          <div class="streak-card">
            <div class="eyebrow">Login streak</div>
            <div class="streak-days" id="streakDays"></div>
          </div>
        </section>

        <!-- SHOP -->
        <section class="pane" id="paneShop" hidden>
          <h2 class="pane-title">Shop</h2>
          <p class="pane-sub">Spend the coins you earn on power-ups.</p>
          <div class="list" id="shopList"></div>
        </section>

        <!-- TROPHIES -->
        <section class="pane" id="paneTrophies" hidden>
          <h2 class="pane-title">Trophies</h2>
          <p class="pane-sub" id="trophySub"></p>
          <div class="trophy-grid" id="trophyGrid"></div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar">
        <button class="tab on" data-pane="Home"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 11.2h2.7V20h5v-5.6h3.6V20h5v-8.8h2.7L12 3Z"/></svg><span>Home</span></button>
        <button class="tab" data-pane="Map"><svg viewBox="0 0 24 24"><path d="M9 3 3 5.5v15.3l6-2.5 6 2.5 6-2.5V3L15 5.5 9 3Zm.8 2.9 4.4 1.8v10.4l-4.4-1.8V5.9Z"/></svg><span>Map</span></button>
        <button class="tab" data-pane="Quests"><svg viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.4 5.9 20.8l1.4-6.8L2.2 9.3l6.9-.8L12 2.2Z"/></svg><span>Quests</span><em class="badge" id="tabQuestBadge" hidden>0</em></button>
        <button class="tab" data-pane="Shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l1.2 12H3.8L5 8Zm3-1a4 4 0 0 1 8 0v1h-2V7a2 2 0 0 0-4 0v1H8V7Z"/></svg><span>Shop</span></button>
        <button class="tab" data-pane="Trophies"><svg viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v3H8v-3h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3Zm-1 4v1a2 2 0 0 0 1.2 1.8A8 8 0 0 1 7 7H6Zm12 0h-1a8 8 0 0 1-.2 2.8A2 2 0 0 0 18 8V7Z"/></svg><span>Trophies</span></button>
      </nav>
    </div>

    <!-- ===================== GAME ===================== -->
    <div id="game" class="screen" hidden>
      <header class="game-top">
        <button class="icon-btn" id="homeBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4 1.8-1.8L11.6 12l5.6-5.6-1.8-1.8Z"/></svg></button>
        <div class="game-title"><b id="levelTitle">Level 1</b><span id="levelWorld">Sunny Meadow</span></div>
        <button class="icon-btn" id="resetBtn" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8Z"/></svg></button>
      </header>
      <div class="goal-row">
        <div class="pill moves-pill"><span>Moves</span><b id="moveCount">0</b></div>
        <div class="goal" id="goalStars" aria-label="Star goals"></div>
        <div class="pill"><i class="coin"></i><b id="gameCoins">0</b></div>
      </div>
      <div class="timer idle" id="timer"><i id="timerBar"></i><span id="timerText">1:00</span></div>
      <div class="combo" id="combo"><span id="comboText">x2</span><i id="comboBar"></i></div>
      <div class="tip" id="tip"></div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="boosters">
        <button class="booster" id="boosterUndo"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M12 5V2L6.5 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8Z"/></svg></span><span class="b-name">Undo</span><span class="b-count" id="cntUndo">0</span></button>
        <button class="booster" id="boosterHammer"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M13.5 3 9 7.5l1.6 1.6-6.9 6.9 2.3 2.3 6.9-6.9 1.6 1.6L19 8.5 13.5 3Z"/></svg></span><span class="b-name">Hammer</span><span class="b-count" id="cntHammer">0</span></button>
        <button class="booster" id="boosterFreeze"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-1 3v6l4.2 2.5 1-1.7L13 12V7h-2Z"/></svg></span><span class="b-name">Freeze</span><span class="b-count" id="cntFreeze">0</span></button>
        <button class="booster" id="boosterVac"><span class="b-ic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9h2a7 7 0 0 1 7-7V3Zm0 4a5 5 0 0 0-5 5h2a3 3 0 0 1 3-3V7Zm0 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm9 1a9 9 0 0 1-9 9v-2a7 7 0 0 0 7-7h2Zm-4 0a5 5 0 0 1-5 5v-2a3 3 0 0 0 3-3h2Z"/></svg></span><span class="b-name">Vacuum</span><span class="b-count" id="cntVac">0</span></button>
      </div>
    </div>

    <!-- ===================== MODALS ===================== -->
    <div class="overlay hidden" id="modal"><div class="sheet" id="sheet"></div></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="src/sound.js?v=26"></script>
    <script src="src/worlds.js?v=26"></script>
    <script src="src/brick.js?v=26"></script>
    <script src="src/engine.js?v=26"></script>
    <script src="src/app.js?v=26"></script>
  <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    </script>
  </body>
</html>
